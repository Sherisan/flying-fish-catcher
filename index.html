<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flying Fish Catcher</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffbe6b"/><stop offset="1" stop-color="#e5502a"/></linearGradient>
          <clipPath id="lc"><circle cx="22" cy="22" r="21"/></clipPath>
        </defs>
        <circle cx="22" cy="22" r="21" fill="url(#lg)"/>
        <g clip-path="url(#lc)"><path d="M0 31c5-3 9 2 14 0s9-3 14 0 9 2 16-1v16H0z" fill="#0e1f2d"/><path d="M0 35c5-2 9 1 14 0s9-2 14 0 9 1 16-1" fill="none" stroke="#2fb7c9" stroke-width="1.4" opacity=".8"/></g>
        <g transform="rotate(-26 22 19)">
          <path d="M24 17.5c-3.5-6-9-8-13.5-8 3 3 5.5 6 8 9.2z" fill="#fff" opacity=".8"/>
          <ellipse cx="22.5" cy="19" rx="10" ry="4.2" fill="#fff"/>
          <path d="M13 19l-6.5-5v10z" fill="#fff"/>
          <circle cx="29.2" cy="18" r="1.3" fill="#0e1f2d"/>
        </g>
      </svg>
      <div class="word"><span>Flying Fish</span><b>CATCH<i>ER</i></b></div>
    </div>
    <div class="history" id="history" aria-label="Recent rounds, newest first"></div>
    <div class="wallet">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#d8b46f"/><circle cx="14" cy="14" r="10" fill="none" stroke="#8a6a2e" stroke-width="1.5"/><path d="M8.5 14.5c2.5-3.5 6-4 9.5-1l2.5-2v6l-2.5-2c-3.5 3-7 2.5-9.5-1z" fill="#5b4416"/></svg>
      <div><span>Balance</span><strong id="balance">1,000.00</strong></div>
    </div>
  </header>

  <main class="layout">
    <aside class="side" aria-label="Bets and field guide">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-all" aria-selected="true" aria-controls="pane-all" type="button">All bets</button>
        <button role="tab" id="tab-mine" aria-selected="false" aria-controls="pane-mine" type="button">My bets</button>
        <button role="tab" id="tab-guide" aria-selected="false" aria-controls="pane-guide" type="button">Field guide</button>
      </div>
      <div class="pane" id="pane-all" role="tabpanel" aria-labelledby="tab-all">
        <div class="sum"><span id="crewCount">0 bets</span><strong id="crewTotal">0.00</strong></div>
        <ol class="list" id="players"></ol>
      </div>
      <div class="pane" id="pane-mine" role="tabpanel" aria-labelledby="tab-mine" hidden>
        <ol class="list" id="mine"></ol>
      </div>
      <div class="pane guide" id="pane-guide" role="tabpanel" aria-labelledby="tab-guide" hidden></div>
      <div class="foot"><span>Play credits only. No real money.</span><button class="refill" id="refill" type="button" hidden>Refill to 1,000</button></div>
    </aside>

    <section class="game" aria-label="Game">
      <div class="sea" id="seaWrap">
        <canvas id="sea" aria-label="A trawler crew harpoons and reels in fish until the ship drops a sea mine"></canvas>
        <div class="hud">
          <div class="tag"><b id="roundNo">Round 1,000</b> · <span id="tag">Bets open</span></div>
          <div class="mult" id="mult" data-state="idle">1.00×</div>
          <div class="status" id="status">Next round in 6.0s</div>
          <div class="bar" id="bar"><i id="barFill"></i></div>
          <div class="banner" id="banner"></div>
        </div>
        <div class="corner">
          <button class="chip" id="sound" type="button" aria-pressed="true" aria-label="Sound">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <span class="lbl" id="soundLabel">Sound on</span>
          </button>
          <button class="chip" id="musicBtn" type="button" aria-pressed="true" aria-label="Music">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span class="lbl" id="musicLabel">Music on</span>
          </button>
          <button class="chip" id="skyBtn" type="button" aria-label="Change sky colours">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="lbl" id="skyLabel">Golden sunset</span>
          </button>
          <div class="chip">Haul <b id="haul">0</b></div>
        </div>
        <div class="toast" id="toast"><span id="toastText"></span></div>
        <ol class="feed" id="feed" aria-label="Latest catches"></ol>
      </div>
      <div class="slots" id="slots"></div>
    </section>
  </main>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<!-- Scripts share one global scope and must load in this order. -->
<script src="js/01-setup.js"></script>
<script src="js/02-draw-helpers.js"></script>
<script src="js/03-creatures.js"></script>
<script src="js/04-world.js"></script>
<script src="js/05-scenery.js"></script>
<script src="js/06-crew.js"></script>
<script src="js/07-ship.js"></script>
<script src="js/08-render.js"></script>
<script src="js/09-game.js"></script>
<script src="js/10-audio.js"></script>
<script src="js/11-main.js"></script>
</body>
</html>
